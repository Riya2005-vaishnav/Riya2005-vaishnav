<text x="28" y="112" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#C9D1D9">A vision LLM (Gemini) drafts findings and an impression</text><text x="28" y="133" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#C9D1D9">from a scan. A doctor reviews, edits and approves the</text><text x="28" y="154" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#C9D1D9">final report. The AI never produces the final report.</text><polygon points="30,177 30,185 37,181" fill="#FFA630"/><text x="46" y="187" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#E6EDF3">FastAPI + SQLAlchemy + PostgreSQL REST API</text><polygon points="30,202 30,210 37,206" fill="#FFA630"/><text x="46" y="212" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#E6EDF3">JWT (bcrypt) with role-based access for doctors</text><polygon points="30,227 30,235 37,231" fill="#FFA630"/><text x="46" y="237" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#E6EDF3">Non-medical images flagged, never reported as normal</text><polygon points="30,252 30,260 37,256" fill="#FFA630"/><text x="46" y="262" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#E6EDF3">DRAFT/FINAL PDF export (ReportLab, Pillow)</text><polygon points="30,277 30,285 37,281" fill="#FFA630"/><text x="46" y="287" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="14" fill="#E6EDF3">React + Tailwind UI, deployed on Render + Vercel</text>
<rect x="28" y="322" width="60" height="26" rx="13" fill="#C1440E" fill-opacity=".22" stroke="#FFA630" stroke-opacity=".55"/><text x="58" y="339.5" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="12" fill="#FFD08A">React</text><rect x="96" y="322" width="74" height="26" rx="13" fill="#C1440E" fill-opacity=".22" stroke="#FFA630" stroke-opacity=".55"/><text x="132" y="339.5" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="12" fill="#FFD08A">FastAPI</text><rect x="177" y="322" width="95" height="26" rx="13" fill="#C1440E" fill-opacity=".22" stroke="#FFA630" stroke-opacity=".55"/><text x="225" y="339.5" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="12" fill="#FFD08A">PostgreSQL</text><rect x="280" y="322" width="116" height="26" rx="13" fill="#C1440E" fill-opacity=".22" stroke="#FFA630" stroke-opacity=".55"/><text x="338" y="339.5" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="12" fill="#FFD08A">Gemini Vision</text><rect x="404" y="322" width="45" height="26" rx="13" fill="#C1440E" fill-opacity=".22" stroke="#FFA630" stroke-opacity=".55"/><text x="427" y="339.5" text-anchor="middle" font-family="'Consolas','Courier New',monospace" font-size="12" fill="#FFD08A">JWT</text>
